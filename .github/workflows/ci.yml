name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Cache the blobless oh-my-pi clone; only the pinned commit matters.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: client-${{ hashFiles('client.json') }}

      - name: Build the pinned collab-web client
        run: bun run client

      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build

      # No NGROK_AUTHTOKEN on a runner, and the relay has no local-only mode,
      # so the binary can only be checked up to its refusal. The HTTP surface
      # is covered by the tests, against the library.
      - name: Smoke test the binary
        run: |
          ./bin/omp-ngrok-relay --version
          ./bin/omp-ngrok-relay --help | grep -q NGROK_AUTHTOKEN
          if NGROK_AUTHTOKEN= ./bin/omp-ngrok-relay --port 7466; then
            echo "started without a token; the tunnel is supposed to be mandatory" >&2
            exit 1
          fi

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --print-build-logs
      - run: nix build .#relay --print-build-logs
      - run: ./result/bin/omp-ngrok-relay --version
      - run: nix build .#container --print-build-logs
