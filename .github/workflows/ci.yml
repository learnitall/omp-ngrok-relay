name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to the version nixpkgs ships, so the bun and nix paths compile
      # the same client and `latest` cannot break the build on its own.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      # Cache the blobless oh-my-pi clone; only the pinned commit matters.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: client-${{ hashFiles('client.json') }}

      - name: Build the pinned collab-web client
        run: bun run client

      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build

      # `bun test` covers the protocol in-process; this covers the artifact CI
      # actually ships. Needs no NGROK_AUTHTOKEN, since the tunnel is optional.
      - name: End-to-end against the binary
        run: |
          ./bin/omp-ngrok-relay --version
          ./bin/omp-ngrok-relay --help | grep -q NGROK_AUTHTOKEN
          bun run e2e:local

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --print-build-logs
      - run: nix build .#relay --print-build-logs
      - run: ./result/bin/omp-ngrok-relay --version
      - run: nix build .#container --print-build-logs
